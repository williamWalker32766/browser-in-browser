<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser-in-Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="dark">
    <div class="browser-shell">
      <header class="chrome-header">
        <div class="tab-strip-wrap">
          <div id="tabsBar" class="tabs-bar" aria-label="Tabs"></div>
          <button id="newTabBtn" class="small-icon-button" aria-label="New tab">＋</button>
        </div>

        <div class="toolbar">
          <div class="nav-controls">
            <button id="backBtn" class="circle-button" aria-label="Back">←</button>
            <button id="forwardBtn" class="circle-button" aria-label="Forward">→</button>
            <button id="refreshBtn" class="circle-button" aria-label="Refresh">⟳</button>
          </div>

          <div class="address-area">
            <select id="searchEngineSelect" aria-label="Search engine selector">
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="duckduckgo">DuckDuckGo</option>
            </select>

            <div class="address-wrap">
              <span id="securityIndicator" class="address-icon">🔒</span>
              <input id="addressBar" type="text" spellcheck="false" aria-label="Address bar" />
              <button id="goBtn" class="primary-button">Go</button>
            </div>
          </div>

          <div class="extra-controls">
            <button id="themeToggle" class="circle-button" aria-label="Toggle theme">☀️</button>
            <button id="homeBtn" class="circle-button" aria-label="Home">⌂</button>
          </div>
        </div>
      </header>

      <main class="browser-surface">
        <iframe
          id="browserFrame"
          title="Embedded browser"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
        ></iframe>

        <div id="blockedMessage" class="blocked-message hidden">
          This site blocks embedding in an iframe. Try a different site or use a different URL.
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
